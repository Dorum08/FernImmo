# Kompakte Konfiguration für das NAS (Portainer): /volume1/Dockerdaten/FernImmo/config/config.yaml
# Alle weiteren Einstellungen: siehe config.example.yaml. Suchen pflegst du danach in der Weboberfläche.
# public_url unten auf die IP deines NAS anpassen.
db_path: data/fernimmo.db
timezone: Europe/Berlin
interval_minutes: 20
quiet_hours: [1, 6]
map_center: [49.4521, 11.0767]
map_zoom: 11

sources:
  kleinanzeigen:
    # Ohne urls: bundesweit, neueste zuerst. Passt automatisch zu allen Suchen in der
    # Weboberfläche – Inserate außerhalb deiner Suchgebiete werden vorab aussortiert.
    max_pages_first_run: 20   # beim ersten Lauf / nach geänderter Suche so weit zurückblättern
    max_pages_feed: 10        # sonst höchstens so viele Seiten, bis wieder Bekanntes kommt
  immowelt:
    # fetcher: playwright      # echter Browser – nur mit dem Image ghcr.io/dorum08/fernimmo:browser
    urls:
      - url: https://www.immowelt.de/classified-search?distributionTypes=Buy&estateTypes=Apartment&locations=AD08DE6345&numberOfRoomsMax=2
        type: kauf

profiles:
  - name: Nürnberg Fernwärme
    listing_types: [kauf]
    rooms_min: 1
    rooms_max: 2
    heating_required: [fernwaerme]
    plz: ["904"]
    exclude_flags: [gesuch, versteigerung]

notify:
  telegram:
    enabled: ${TELEGRAM_ENABLED:-false}
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}

web:
  users:
    ich: ${WEB_PASSWORD}
  public_url: http://192.168.178.38:18451
