# FernImmo als Portainer-Stack (z. B. auf einem Asustor-NAS).
# In Portainer: Stacks → Add stack → Web editor → diesen Inhalt einfügen.
# Vorher den Ordner /volume1/Docker/fernimmo mit config.yaml anlegen (Vorlage: deploy/config.nas.yaml).
services:
  fernimmo:
    image: ghcr.io/dorum08/fernimmo:latest
    container_name: fernimmo
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      WEB_PASSWORD: ${WEB_PASSWORD}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NTFY_ENABLED: ${NTFY_ENABLED:-false}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
    volumes:
      - /volume1/Docker/fernimmo/config.yaml:/app/config.yaml:ro
      - /volume1/Docker/fernimmo/data:/app/data
    ports:
      - "18451:8080"  # im ganzen Heimnetz unter http://<NAS-IP>:18451 erreichbar (links ggf. anderen Port wählen)
