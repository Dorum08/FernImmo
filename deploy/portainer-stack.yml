# FernImmo als Portainer-Stack (Asustor-NAS), im Schema /volume1/Dockerdaten/<App>/<Ordner>.
# Portainer: Stacks → Add stack → Web editor → einfügen, Umgebungsvariable WEB_PASSWORD setzen.
# Die Ordner unter /volume1/Dockerdaten/FernImmo vorher anlegen; config.yaml entsteht beim
# ersten Start automatisch als Vorlage im Ordner "config".
version: '3'
services:
  fernimmo:
    container_name: fernimmo
    hostname: fernimmo
    image: ghcr.io/dorum08/fernimmo:latest
    ports:
      - "18451:8080" # Weboberfläche im Heimnetz: http://<NAS-IP>:18451
    volumes:
      - /volume1/Dockerdaten/FernImmo/config:/app/config # config.yaml (wird beim ersten Start angelegt)
      - /volume1/Dockerdaten/FernImmo/data:/app/data # Datenbank und tägliche Sicherungen (data/backups)
    environment:
      - TZ=Europe/Berlin
      - FERNIMMO_CONFIG=/app/config/config.yaml
      - WEB_PASSWORD=${WEB_PASSWORD}
      - TELEGRAM_ENABLED=${TELEGRAM_ENABLED:-false}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    restart: unless-stopped
