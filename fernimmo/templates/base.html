<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FernImmo{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#677084;--line:#e3e6ec;--accent:#c2410c;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--muted:#9aa3b5;--line:#2a313d;--accent:#fb923c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header .logo{font-weight:700;font-size:18px;color:var(--fg)}header nav{display:flex;gap:14px;flex:1}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stats .card{flex:1;min-width:130px}.stats b{display:block;font-size:22px}
form.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
select,input,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:start}
.item img{width:120px;height:90px;object-fit:cover;border-radius:6px;background:var(--line)}
.item h3{margin:0 0 4px;font-size:16px}.facts{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.facts b{color:var(--fg)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.b-voll,.fw-ja{color:var(--ok)}.b-teilweise,.fw-unbekannt{color:var(--warn)}.fw-nein,.fw-eher_nein,.b-none{color:var(--bad)}
.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
pre{white-space:pre-wrap;font:inherit}
@media (max-width:640px){.item{grid-template-columns:1fr}.item img{width:100%;height:160px}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">🏠 FernImmo</a>
  <nav><a href="/">Inserate</a><a href="/runs">Suchläufe</a></nav>
  <form method="post" action="/run"><button class="primary">Jetzt suchen</button></form>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
