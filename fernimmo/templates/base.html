<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FernImmo{% endblock %}</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="theme-color" content="#c2410c">
{% block head %}{% endblock %}
<style>
:root{--bg:#f6f7f9;--card:#fff;--fg:#1d2330;--muted:#677084;--line:#e3e6ec;--accent:#c2410c;--ok:#15803d;--warn:#b45309;--bad:#b91c1c}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--fg:#e6e9ef;--muted:#9aa3b5;--line:#2a313d;--accent:#fb923c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
header{display:flex;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
header .logo{font-weight:700;font-size:18px;color:var(--fg)}header nav{display:flex;gap:14px;flex:1}
main{max-width:1200px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.stats .card{flex:1;min-width:130px}.stats b{display:block;font-size:22px}
form.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
label{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
select,input,button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg)}
button{cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:120px 1fr auto;gap:12px;align-items:start}
.item img{width:120px;height:90px;object-fit:cover;border-radius:6px;background:var(--line)}
.item h3{margin:0 0 4px;font-size:16px}.facts{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.facts b{color:var(--fg)}
.badge{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;border:1px solid currentColor;white-space:nowrap}
.b-voll,.fw-ja{color:var(--ok)}.b-teilweise,.fw-unbekannt{color:var(--warn)}.fw-nein,.fw-eher_nein,.b-none{color:var(--bad)}
.muted{color:var(--muted)}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
pre{white-space:pre-wrap;font:inherit}
.small{font-size:12px}.lid{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.item-side{display:flex;flex-direction:column;gap:6px;align-items:end}.item-main{min-width:0}
.change-hint{margin-top:4px;font-size:13px}
.social{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;margin-top:8px}
.like{border-radius:99px;padding:3px 12px;color:var(--muted)}.like.on{color:#e11d48;border-color:#e11d48;background:color-mix(in srgb,#e11d48 10%,transparent)}
.comments{flex:1;min-width:220px}.comments summary{cursor:pointer;color:var(--muted);padding:4px 0}
.comment{border-left:3px solid var(--line);padding:2px 0 2px 8px;margin:6px 0}.comment-text{white-space:pre-wrap}
.comment-form{display:flex;gap:6px;margin-top:6px}.comment-form textarea{flex:1;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);resize:vertical}
button.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;font-size:12px}
.table-wrap{overflow-x:auto}.changes .ch-down td:nth-child(4){color:var(--ok)}.changes .ch-up td:nth-child(4){color:var(--bad)}
.changes .ch-offline td,.changes .ch-online td{font-style:italic}
.desc-diff{display:grid;grid-template-columns:1fr 1fr;gap:12px}.desc-diff pre{max-height:300px;overflow:auto;background:var(--bg);padding:8px;border-radius:6px}
.liked-count{color:#e11d48}
.viz-root{--series-1:#257de0;--series-2:#f47230}
@media (prefers-color-scheme:dark){.viz-root{--series-1:#338ced;--series-2:#e76624}}
.chart{position:relative}.chart .grid{stroke:var(--line);stroke-width:1}.chart .axis{fill:var(--muted);font-size:11px}
.chart .label{fill:var(--fg);font-size:12px}.chart .dot{stroke:var(--card);stroke-width:2}.chart .cross{stroke:var(--muted);stroke-dasharray:3 3}
.chart .tip{position:absolute;top:8px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.15);min-width:180px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.search-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px;align-items:center}
.search-tab{padding:6px 12px;border:1px solid var(--line);border-radius:99px;background:var(--card);color:var(--fg);font-size:14px}
.search-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}.search-tab:hover{text-decoration:none;border-color:var(--accent)}
.search-badge{color:#2563eb}
.check-row{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center;margin-top:8px}
label.inline{flex-direction:row;align-items:center;gap:4px;font-size:14px;color:var(--fg)}
.flag-grid{display:grid;grid-template-columns:1fr;gap:2px;margin-top:4px}
aside label input,aside label select{width:100%}aside label.inline input{width:auto}
.circle-panel{margin-bottom:8px;display:grid;gap:8px}.circle-row{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.circle-row label{min-width:150px}.crit-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.crit-grid select,.crit-grid input{width:100%}.circle-row input{width:100%}input[type=range]{padding:0}
.map-big{height:calc(100vh - 260px);min-height:420px;border-radius:10px;border:1px solid var(--line);z-index:0}
.map-small{height:260px;border-radius:8px;border:1px solid var(--line);z-index:0}
.drawing,.drawing .leaflet-interactive{cursor:crosshair!important;touch-action:none}
.area-layout{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
button.active{outline:3px solid var(--accent);outline-offset:1px}
.plz-list{display:flex;flex-wrap:wrap;gap:4px;max-height:300px;overflow:auto}
.plz-chip{flex-direction:row;align-items:center;gap:3px;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:13px;color:var(--fg);cursor:pointer}
.plz-chip.on{background:color-mix(in srgb,#2563eb 15%,transparent);border-color:#2563eb}
.plz-tools{display:flex;gap:6px;margin-bottom:8px}.small-btn{font-size:12px;padding:3px 8px}
.area-list{list-style:none;padding:0;margin:0;display:grid;gap:8px}.area-list li{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.area-name{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle}
.dot.ring{border:3px solid #d97706;background:#fff;width:8px;height:8px}
.sq{display:inline-block;width:12px;height:10px;border:2px solid;vertical-align:middle}.sq.dashed{border-style:dashed}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;margin:0 0 8px}
.mkt-good{color:var(--ok)}.mkt-bad{color:var(--bad)}
.kpis{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:13px;margin-top:4px;color:var(--muted)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.calc label input{width:100%}.calc-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.calc-out div{background:var(--bg);border-radius:8px;padding:8px}.calc-out b{display:block;font-size:18px}
.export{display:flex;gap:10px;align-items:center;margin:-4px 0 10px;font-size:13px}
@media (max-width:640px){.item{grid-template-columns:1fr}.item img{width:100%;height:160px}.item-side{flex-direction:row;flex-wrap:wrap;align-items:center}.desc-diff{grid-template-columns:1fr}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.stats .card{min-width:0;padding:6px;text-align:center}
.stats .card span{font-size:10px;display:block;line-height:1.2}.stats b{font-size:18px}
form.filters label{flex:1 1 45%}form.filters select,form.filters input[name=q]{width:100%}
header{gap:8px 12px}.area-layout{grid-template-columns:1fr}.map-big{height:60vh}}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">🏠 FernImmo</a>
  <nav><a href="/">Inserate</a><a href="/karte">Karte</a><a href="/suche">Suchen</a><a href="/markt">Markt</a><a href="/runs">Suchläufe</a></nav>
  {% if user %}<span class="muted small">angemeldet als <b>{{ user }}</b></span>{% endif %}
  <a href="fernimmo-app://settings" id="app-settings" class="small" hidden>⚙ App</a>
  <script>if (navigator.userAgent.includes("FernImmoApp")) document.getElementById("app-settings").hidden = false;</script>
  <form method="post" action="/run"><button class="primary">Jetzt suchen</button></form>
</header>
<main>{% block content %}{% endblock %}</main>
<script>
// Like ohne Neuladen der Seite (ohne JavaScript funktioniert das Formular normal)
document.addEventListener("submit", async (e) => {
  const f = e.target;
  if (!f.classList.contains("like-form")) return;
  e.preventDefault();
  try {
    const r = await fetch(f.action, {method: "POST", body: new FormData(f), headers: {Accept: "application/json"}});
    if (!r.ok) throw new Error(r.status);
    const j = await r.json();
    const b = f.querySelector("button");
    b.classList.toggle("on", j.liked);
    b.firstChild.textContent = (j.liked ? "♥" : "♡") + " ";
    b.querySelector("span").textContent = j.likes.length;
    b.title = j.likes.join(", ") || "Noch keine Likes";
    let who = f.nextElementSibling;
    if (!who || !who.classList.contains("small")) {
      who = document.createElement("span"); who.className = "muted small"; f.after(who);
    }
    who.textContent = j.likes.join(", ");
  } catch (err) { f.submit(); }
});
</script>
</body>
</html>
