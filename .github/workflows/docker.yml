name: Docker-Image

on:
  push:
    paths: ["fernimmo/**", "Dockerfile", "requirements.txt", "deploy/docker-entrypoint.sh", "deploy/config.nas.yaml", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # Image in die GitHub-Paketablage (ghcr.io) schreiben

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3          # für ARM-Modelle (z. B. Asustor Drivestor)
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image-Name (Kleinbuchstaben)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
