# FernImmo – Konfiguration
# Kopieren nach config.yaml und anpassen. ${VAR} bzw. ${VAR:-standard} wird aus
# Umgebungsvariablen (.env) ersetzt – so landen Passwörter nicht in dieser Datei.

db_path: data/fernimmo.db
timezone: Europe/Berlin       # für Datum/Uhrzeit in der Weboberfläche
interval_minutes: 20          # Abstand der Suchläufe (±25 % Zufall)
quiet_hours: [1, 6]           # zwischen 1 und 6 Uhr nicht suchen (weglassen = immer)

fetch:
  fetcher: http               # http | playwright (echter Browser, siehe README)
  delay_seconds: [3, 7]       # zufällige Pause zwischen zwei Seitenabrufen
  # proxy: http://user:pass@host:port

# ---------------------------------------------------------------------------
# Quellen. Am zuverlässigsten: Suche im Browser auf dem Portal einstellen
# (Nürnberg, Wohnung kaufen, ggf. Zimmer/Preis) und die URL hier
# einfügen. Die Feinfilterung (Fernwärme etc.) macht FernImmo selbst.
# Die Beispiel-URLs unten bitte einmal im Browser öffnen und prüfen, ob sie
# wirklich Nürnberg zeigen (Orts-IDs der Portale ändern sich gelegentlich).
# ---------------------------------------------------------------------------
sources:
  kleinanzeigen:
    enabled: true
    urls:
      - url: https://www.kleinanzeigen.de/s-wohnung-kaufen/nuernberg/anzeige:angebote/c196l976
        type: kauf
    max_pages: 3
    max_details_per_run: 40   # max. neue Detailseiten pro Lauf
    refresh_hours: 6          # Treffer/gelikte Inserate spätestens alle 6 h neu laden (Änderungsverlauf)
    refresh_per_run: 15       # höchstens so viele Neu-Abrufe pro Lauf

  immowelt:
    enabled: true
    urls:
      # Suche auf immowelt.de einstellen und URL aus der Adresszeile kopieren
      - url: https://www.immowelt.de/classified-search?distributionTypes=Buy&estateTypes=Apartment&locations=AD08DE6345&numberOfRoomsMax=2
        type: kauf
    max_pages: 3
    max_details_per_run: 40
    refresh_hours: 6
    refresh_per_run: 15

  immoscout24:
    enabled: false            # starker Bot-Schutz – erst mit fetcher: playwright probieren
    fetcher: playwright
    urls:
      - url: https://www.immobilienscout24.de/Suche/de/bayern/nuernberg/wohnung-kaufen?numberofrooms=1.0-2.0
        type: kauf
    max_pages: 2
    max_details_per_run: 20

  # --- Weitere Portale (lernfähiger Adapter) --------------------------------
  # Für diese Portale gibt es keinen eigenen Code: FernImmo erkennt die Inserats-
  # Links auf der Ergebnisseite selbst und liest die Detailseiten allgemein aus.
  # Jeweils die Suche im Browser einstellen (Ort/Region, Wohnung kaufen, gern
  # „neueste zuerst“) und die URL unter urls eintragen. Ohne URL ist das Portal aus.
  # Nach dem ersten Lauf mit `python -m fernimmo check <Inserat-URL>` prüfen,
  # ob Zimmer, Fläche, Preis und Heizung erkannt werden.
  ohne-makler:
    urls: []        # z.B. Suchergebnis-URL von ohne-makler.de
    type_default: kauf
  immobilo:
    urls: []        # Meta-Suche: Inserate auf Immowelt/Kleinanzeigen werden mit deren Adapter gelesen
    type_default: kauf
  immobilien.de:
    urls: []
    type_default: kauf
  meinestadt:
    urls: []        # Immobilienteil von meinestadt.de (meist Inserate von Immowelt)
    type_default: kauf
  ivd24:
    urls: []        # ivd24immobilien.de
    type_default: kauf
  regionalimmobilien24:
    urls: []
    type_default: kauf
  1a-immobilienmarkt:
    urls: []
    type_default: kauf

  # Vergleichsmieten: Miet-Suchseiten mitlesen, damit Kostenrechner und Marktseite mit
  # echten Mieten aus derselben PLZ rechnen (statt calculator.miete_pro_qm).
  # mieten-kleinanzeigen:
  #   type: kleinanzeigen
  #   vergleichsmieten: true
  #   urls:
  #     - url: https://www.kleinanzeigen.de/s-wohnung-mieten/nuernberg/anzeige:angebote/c203l976
  #       type: miete
  #   max_details_per_run: 20

  # Beliebige weitere Seite (z.B. Wohnungsbaugesellschaft, Makler-Website):
  # meine-seite:
  #   type: generic
  #   urls: [https://www.example.de/kaufangebote]
  #   link_pattern: '/immobilie/(\d+)'   # optional – ohne wird das Muster automatisch erkannt
  #   content_selector: 'main'           # optional: CSS-Selektor für den Inseratstext
  #   pagination: '{url}?page={page}'    # optional: weitere Ergebnisseiten
  #   type_default: kauf

# ---------------------------------------------------------------------------
# Lage: Koordinaten liefern die Portale teils selbst; sonst wird die Adresse über
# OpenStreetMap (Nominatim) in Koordinaten umgerechnet – höchstens 1 Anfrage/s,
# Ergebnisse werden gespeichert. Ohne Straße wird der PLZ-Mittelpunkt genommen.
# Das Suchgebiet (PLZ-Auswahl, Freihand-Flächen) legst du in der Weboberfläche
# unter "Suche" fest; es ersetzt dann die plz-Angabe der Profile.
# ---------------------------------------------------------------------------
geocoding:
  enabled: true
  # email: deine@adresse.de   # optional, empfohlen von der Nominatim-Nutzungsrichtlinie
map_center: [49.4521, 11.0767]   # Startpunkt der Karten (hier Nürnberg; weglassen = ganz Deutschland)
map_zoom: 11

# Vorgaben für den Kostenrechner (auf der Detailseite im Browser änderbar)
calculator:
  # grunderwerbsteuer_pct: 3.5   # weglassen = automatisch nach Bundesland der Wohnung
  # grunderwerbsteuer_laender: {HB: 5.0}   # einzelne Landessätze überschreiben
  notar_grundbuch_pct: 2.0
  makler_pct: 3.57               # Käuferanteil; bei "provisionsfrei" automatisch 0
  eigenkapital: 60000
  zins_pct: 3.6
  tilgung_pct: 2.0
  miete_pro_qm: 12.0             # Vergleichsmiete für die Rendite – bitte an Mietspiegel/Lage anpassen
  hausgeld_nicht_umlagefaehig_pct: 35

# ---------------------------------------------------------------------------
# Suchprofile – nur für den ALLERERSTEN Start: daraus werden die Suchen angelegt.
# Danach pflegst du Suchen (beliebig viele, mit Namen, Kriterien und Gebiet)
# in der Weboberfläche unter „Suchen“; Änderungen hier wirken dann nicht mehr.
# "voll" = alles erfüllt und Fernwärme bestätigt,
# "teilweise" = nichts spricht dagegen, aber z.B. Heizung nicht angegeben.
# ---------------------------------------------------------------------------
profiles:
  - name: Nürnberg 1–2 Zi. Fernwärme
    listing_types: [kauf]        # nur Kaufangebote ([miete] bzw. [miete, kauf] ebenfalls möglich)
    rooms_min: 1
    rooms_max: 2                 # 2.5 für 2,5-Zimmer-Wohnungen
    # area_min: 30
    # price_max: 250000          # max. Kaufpreis in €
    heating_required: [fernwaerme]
    unknown_heating: teilweise   # teilweise = trotzdem melden (gelb) | ignorieren
    plz: ["904"]                 # Gebiet der ersten Suche (PLZ oder PLZ-Anfänge); leer = bundesweit
    exclude_flags: [gesuch, versteigerung]
    # weitere Ausschlüsse: erbpacht, vermietet (= Kapitalanlage mit Mieter), denkmal,
    #                      wbs, senioren, tausch, wg, befristet
    exclude_keywords: []         # freie Stichwörter, z.B. ["Bieterverfahren"]
    # required_features: [balkon]   # balkon, einbaukueche, aufzug, keller, stellplatz, ...

# ---------------------------------------------------------------------------
# Benachrichtigungen
# ---------------------------------------------------------------------------
notify:
  levels: [voll, teilweise]   # welche Treffer gemeldet werden
  price_drops: true           # Preissenkung bei gemeldeten oder gelikten Inseraten melden
  first_run: false            # beim allerersten Lauf nicht jeden Altbestand einzeln melden
  alert_failed_runs: 3        # Warnung, wenn ein Portal so viele Läufe in Folge nichts liefert (0 = aus)

  telegram:
    enabled: ${TELEGRAM_ENABLED:-false}
    bot_token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    buttons: true               # Knöpfe „Like“, „Ausblenden“, „Details“ unter jeder Meldung
    # users:                    # Telegram-Nutzer-ID -> Name in FernImmo (für Likes); sonst erster Web-Nutzer
    #   123456789: ich

  ntfy:
    enabled: ${NTFY_ENABLED:-false}
    server: https://ntfy.sh
    topic: ${NTFY_TOPIC}        # langen, zufälligen Namen wählen!
    # token: ${NTFY_TOKEN}

  email:
    enabled: ${EMAIL_ENABLED:-false}
    host: ${SMTP_HOST}
    port: 587
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    to: ${EMAIL_TO}

web:
  host: 0.0.0.0
  port: 8080                  # Port im Container; nach außen gilt der Port aus docker-compose (18451)
  # Nutzer für Login, Likes und Kommentare (Name: Passwort). Nutzer ohne
  # Passwort werden ignoriert; sind alle leer, gibt es keinen Login
  # (dann nur hinter VPN/Reverse-Proxy betreiben!).
  users:
    ich: ${WEB_PASSWORD}
    # zweite_person: ${WEB_PASSWORD_2}
  # Adresse, unter der du FernImmo vom Handy aus erreichst (z. B. über WireGuard).
  # Wird für den „Details“-Knopf in Telegram genutzt.
  # public_url: http://192.168.178.10:18451

# Tägliche Datensicherung der Datenbank (Likes, Kommentare, Verlauf, Suchen)
backup:
  enabled: true
  # dir: data/backups         # Standard: Ordner "backups" neben der Datenbank
  keep: 14                    # so viele Tagesstände behalten
