services:
  fernimmo:
    build:
      context: .
      args:
        PLAYWRIGHT: "0"        # "1" für Browser-Abruf (z.B. ImmoScout24)
    container_name: fernimmo
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    ports:
      - "18451:8080"   # im ganzen Heimnetz unter http://<Server-IP>:18451 (Passwort in .env setzen!)
